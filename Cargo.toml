[package]
name = "skratch"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A small, local-first Linux music library and player"

[dependencies]
anyhow = "1"
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
lofty = "0.22"
notify = "8"
rand = "0.9"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
souvlaki = "0.8"
tar = "0.4"
tempfile = "3"
ureq = "3"
url = "2"
walkdir = "2"
xz2 = { version = "0.1", features = ["static"] }

[profile.release]
lto = "thin"
strip = true

[features]
screenshot = ["eframe/__screenshot"]
