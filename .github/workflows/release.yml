name: Release

# Builds the AppImage and the Windows zip. Pushing a tag like v0.1.0 also publishes it as a GitHub Release;
# "Run workflow" on the Actions tab builds one without publishing, to try it out.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # the oldest runner on offer, so the AppImage runs on older distributions too (glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked --lib

      - name: Build
        run: cargo build --release --locked

      - name: Make the AppImage
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          mkdir -p AppDir/usr/bin
          cp target/release/skratch AppDir/usr/bin/skratch
          cp assets/icon.png AppDir/skratch.png
          # the checked-in .desktop file points at a developer's build folder
          sed 's|^Exec=.*|Exec=skratch|' assets/skratch.desktop > AppDir/skratch.desktop
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/skratch" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "Skratch-${version}-x86_64.AppImage"
          sha256sum Skratch-*.AppImage > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: Skratch-AppImage
          path: |
            Skratch-*.AppImage
            SHA256SUMS

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Skratch-*.AppImage
            SHA256SUMS
          generate_release_notes: true

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked --lib

      - name: Build
        run: cargo build --release --locked

      - name: Make the zip
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          mkdir Skratch
          cp target/release/skratch.exe Skratch/Skratch.exe
          cp LICENSE Skratch/
          zip="Skratch-${version}-windows-x86_64.zip"
          7z a -tzip "$zip" Skratch
          sha256sum "$zip" > SHA256SUMS-windows

      - uses: actions/upload-artifact@v4
        with:
          name: Skratch-Windows
          path: |
            Skratch-*-windows-x86_64.zip
            SHA256SUMS-windows

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Skratch-*-windows-x86_64.zip
            SHA256SUMS-windows
          generate_release_notes: true
